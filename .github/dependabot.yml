version: 2

updates:
  # Node 依赖：package.json 与 pnpm-lock.yaml 一起更新
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-deps:
        patterns: ["*"]
    ignore:
      # astro check 目前仅支持到 TypeScript 6.x；待支持 TS 7.1+ / @astrojs/ts-content-mapper 后移除
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]

  # GitHub Actions 版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
