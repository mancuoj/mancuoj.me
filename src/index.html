<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="mancuoj" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="preload" href="syne.woff2" as="font" type="font/woff2" crossorigin />
    <title>mancuoj</title>

    <style>
      /* Syne (SIL OFL 1.1) subset to this page's glyphs */
      @font-face {
        font-family: 'Syne';
        src: url('syne.woff2') format('woff2');
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
      }

      :root {
        color-scheme: light dark;

        --bg: #ffffff;
        --fg: #12110d;
        --dim: rgba(18, 17, 13, 0.55);
        --line: rgba(18, 17, 13, 0.7);
        --accent: #e0361c;

        --pad: clamp(1.25rem, 4vw, 3.5rem);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121110;
          --fg: #edeae2;
          --dim: rgba(237, 234, 226, 0.55);
          --line: rgba(237, 234, 226, 0.65);
          --accent: #ff3b2f;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100svh;
        overflow-x: hidden;
        display: flex;
        padding: var(--pad);
        background: var(--bg);
        color: var(--fg);
        font-family:
          'Syne',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        line-height: 1;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      ::selection {
        background: var(--accent);
        color: var(--bg);
      }

      .poster {
        position: relative;
        flex: 1;
        width: 100%;
        max-width: 84rem;
        margin-inline: auto;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 2.5rem;
      }

      .chip {
        position: absolute;
        top: 50%;
        right: 0;
        width: clamp(2.25rem, 9vw, 7rem);
        aspect-ratio: 1;
        background: var(--accent);
        translate: 0 -50%;
      }

      .wordmark {
        font-size: clamp(2.2rem, 12vw, 11.5rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 0.82;
        white-space: nowrap;
      }

      .wordmark .dot {
        color: var(--accent);
      }

      .index {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        border-top: 2px solid var(--line);
      }

      .link {
        display: flex;
        align-items: baseline;
        gap: 0.7rem;
        padding: 1.1rem 0;
        color: inherit;
        text-decoration: none;
        font-size: clamp(1.05rem, 3.4vw, 1.6rem);
        font-weight: 700;
      }

      .link + .link {
        border-left: 1px solid var(--line);
        padding-left: clamp(0.9rem, 3vw, 2rem);
      }

      .link:first-child {
        padding-right: clamp(0.9rem, 3vw, 2rem);
      }

      .num {
        font-size: 0.6em;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }

      .txt {
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .arrow {
        margin-left: auto;
        font-size: 0.85em;
        color: var(--dim);
        transition:
          color 180ms ease,
          transform 180ms ease;
      }

      .link:hover .txt,
      .link:focus-visible .txt {
        color: var(--accent);
      }

      .link:hover .arrow,
      .link:focus-visible .arrow {
        color: var(--accent);
        transform: translate(0.12em, -0.12em);
      }

      .link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        .arrow {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="poster">
      <span class="chip" aria-hidden="true"></span>
      <h1 class="wordmark">mancuoj<span class="dot">.</span></h1>

      <nav class="index" aria-label="Links">
        <a class="link" href="https://mancuoj.github.io" target="_blank" rel="noopener noreferrer">
          <span class="num" aria-hidden="true">01</span>
          <span class="txt">Blog</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="link" href="https://github.com/mancuoj" target="_blank" rel="noopener noreferrer">
          <span class="num" aria-hidden="true">02</span>
          <span class="txt">GitHub</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </main>
  </body>
</html>
