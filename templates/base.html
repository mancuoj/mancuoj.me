<!DOCTYPE html>
<html lang="{{ cfg.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ cfg.title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ cfg.description }}{% endblock %}">
<meta property="og:title" content="{% block ogtitle %}{{ cfg.title }}{% endblock %}">
<meta property="og:description" content="{% block ogdesc %}{{ cfg.description }}{% endblock %}">
<meta property="og:type" content="{% block ogtype %}website{% endblock %}">
<meta property="og:url" content="{% block ogurl %}{{ base }}/{% endblock %}">
<meta property="og:image" content="{{ cfg.avatar }}">
{% block ogmeta %}{% endblock %}
<link rel="icon" href="{{ cfg.avatar }}">
{% if cfg.showRss %}<link rel="alternate" type="application/rss+xml" title="{{ cfg.title }}" href="{{ base }}/rss.xml">
{% endif %}<link rel="stylesheet" href="{{ base }}/static/style.css?v={{ asset_ver }}">
<script>
(function () {
  try {
    var t = localStorage.getItem("theme");
    if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
</head>
<body>
{% block header %}
<header class="site-header">
  <div class="site-top">
    <a class="site-home" href="{{ base }}/">
      <img class="avatar" src="{{ cfg.avatar }}" alt="" width="24" height="24">
      <span class="brand">{{ cfg.title }}</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="{{ base }}/tags">标签</a>
    </nav>
  </div>
  <p class="intro">{{ cfg.subtitle }}</p>
</header>
{% endblock %}
<main class="site-main">
{% block content %}{% endblock %}
</main>
<script src="{{ base }}/static/app.js?v={{ asset_ver }}" defer></script>
</body>
</html>
